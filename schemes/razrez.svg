<svg xmlns="http://www.w3.org/2000/svg" width="1075" height="825" viewBox="0 0 1075 825">
<rect width="100%" height="100%" fill="white"/>
<text x="110" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1c2833">Схематичный разрез Ю—С</text>
<text x="110" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1c2833">отметки ориентировочные, уточнит проект</text>
<line x1="87.5" y1="560.0" x2="942.5" y2="560.0" stroke="#27ae60" stroke-width="2" stroke-dasharray="8,4"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" dominant-baseline="middle"><tspan x="884.0" y="544.2">земля ≈ +1,0</tspan></text>
<polygon points="155.0,605.0 445.2,605.0 445.2,470.0 155.0,470.0" stroke="#8a8f98" fill="#eef0f3" stroke-width="2" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1c2833" text-anchor="middle" dominant-baseline="middle"><tspan x="300.1" y="521.0">Уровень 1 (цоколь)</tspan><tspan x="300.1" y="533.0">h≈2,7 черн. / 2,5–2,6 чист.</tspan><tspan x="300.1" y="545.0">пол −0,7 м → ниже земли ≈1,0</tspan></text>
<polygon points="155.0,470.0 445.2,470.0 445.2,330.5 155.0,330.5" stroke="#8a8f98" fill="#eef0f3" stroke-width="2" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1c2833" text-anchor="middle" dominant-baseline="middle"><tspan x="300.1" y="394.2">Уровень 2</tspan><tspan x="300.1" y="406.2">(кирпич, h=2,80)</tspan></text>
<polygon points="445.2,560.0 602.8,560.0 602.8,330.5 445.2,330.5" stroke="#d35400" fill="#fdebd0" stroke-width="2" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="524.0" y="396.5">второй свет</tspan><tspan x="524.0" y="408.5">≈5 м</tspan></text>
<polygon points="445.2,438.5 526.2,438.5 526.2,427.2 445.2,427.2" stroke="#d35400" fill="none" stroke-width="1" stroke-dasharray="3,2" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="8" fill="#d35400" text-anchor="middle" dominant-baseline="middle"><tspan x="485.8" y="413.8">опция: галерея +3,7</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" dominant-baseline="middle"><tspan x="524.0" y="533.0">пристройка: пол = земля (+1,0)</tspan></text>
<polygon points="132.5,330.5 625.2,330.5 378.9,168.5" stroke="#d35400" fill="#fdebd0" stroke-width="2" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" dominant-baseline="middle" font-weight="bold"><tspan x="378.9" y="272.0">Уровень 3 — мансарда (спальни)</tspan></text>
<polygon points="602.8,566.8 701.7,566.8 701.7,560.0 602.8,560.0" stroke="#27ae60" fill="#d5f5e3" stroke-width="1.5" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#1c2833" text-anchor="start" dominant-baseline="middle"><tspan x="710.7" y="564.5">терраса</tspan></text>
<polygon points="155.0,636.5 445.2,636.5 445.2,605.0 155.0,605.0" stroke="#c0392b" fill="#fadbd8" stroke-width="1.5" stroke-dasharray="4,3" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" dominant-baseline="middle"><tspan x="300.1" y="620.8">подводка/усиление фундамента ФБС?</tspan></text>
<polygon points="445.2,582.5 602.8,582.5 602.8,560.0 445.2,560.0" stroke="#d35400" fill="none" stroke-width="1.5" stroke-dasharray="4,3" fill-opacity="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="9" fill="#d35400" text-anchor="middle" dominant-baseline="middle"><tspan x="524.0" y="571.2">плита / МЗЛФ</tspan></text>
<line x1="92.0" y1="605.0" x2="155.0" y2="605.0" stroke="#566573" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="end" dominant-baseline="middle"><tspan x="87.5" y="605.0">±0,00</tspan></text>
<line x1="92.0" y1="470.0" x2="155.0" y2="470.0" stroke="#566573" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="end" dominant-baseline="middle"><tspan x="87.5" y="470.0">+3,00</tspan></text>
<line x1="92.0" y1="330.5" x2="155.0" y2="330.5" stroke="#566573" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="end" dominant-baseline="middle"><tspan x="87.5" y="330.5">+6,10</tspan></text>
<line x1="92.0" y1="168.5" x2="155.0" y2="168.5" stroke="#566573" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="end" dominant-baseline="middle"><tspan x="87.5" y="168.5">≈+9,7 конёк</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="middle" dominant-baseline="middle"><tspan x="155.0" y="663.5">ЮГ (проезд)</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#566573" text-anchor="middle" dominant-baseline="middle"><tspan x="701.7" y="663.5">СЕВЕР (сад)</tspan></text>
<text x="110" y="745" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1c2833" text-anchor="start">v0.2: цоколь углубляем (пол ≈1,0 ниже земли), пристройка — в уровень земли, между ними ≈6 ступеней.</text>
<text x="110" y="765" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1c2833" text-anchor="start">Галерея над кухней на уровне пола ур.2 даст под собой ≈1,7 м — поэтому только как опция на +0,7 (4 ступени вверх) или без неё.</text>
<text x="110" y="785" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1c2833" text-anchor="start">Высота до конька по ПЗЗ ограничена (для ИЖС обычно ≤20 м и ≤3 надземных этажа) — запас есть.</text>
</svg>
